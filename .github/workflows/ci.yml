# Thin wrapper over the local gates (`npm run check`). Disabled while the repository is private:
# the factory runs the same gates locally. Factory-owned file: agents must not edit it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.repository.private }}
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24] # oldest supported LTS in CI and the factory's local version
    env:
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run check

  # CI-only tier: the full suite, including the tests tagged conformance (external tools or downloads).
  # The check job above runs exactly the local tier, so its coverage is the one the factory measured.
  conformance:
    if: ${{ !github.event.repository.private }}
    name: conformance (full suite)
    runs-on: ubuntu-latest
    env:
      FABRICA_ALLOW_MISSING_GITLEAKS: "1"
      FABRICA_CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      # Optional, project-provided tool installation for the conformance tier. Only CI runs it, never
      # the factory or the local gates. Downloads must be verified against a pinned SHA-256.
      - name: conformance tools (ci/conformance-setup.sh, optional)
        shell: bash
        run: |
          if [ -f ci/conformance-setup.sh ]; then bash ci/conformance-setup.sh; else echo "no ci/conformance-setup.sh"; fi
      - run: npm run check

  gitleaks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repository belongs to a GitHub organization (free for personal accounts).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
